<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrants · PaaniLink</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container">
    <div class="page-head">
      <div>
        <h1>Hydrants</h1>
        <p class="muted">Daily water quota, operating hours and the zones each hydrant serves.</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-btn">Add hydrant</button>
    </div>

    <section class="card" aria-label="Filters">
      <form id="filters" class="filters" role="search">
        <div class="field">
          <label for="q">Search</label>
          <input id="q" name="q" type="search" placeholder="Name or location">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status"></select>
        </div>
        <div class="field">
          <label for="zoneIds">Serves zone</label>
          <select id="zoneIds" name="zoneIds"></select>
        </div>
        <div class="field">
          <label for="sortBy">Sort by</label>
          <select id="sortBy" name="sortBy">
            <option value="name:asc">Name (A-Z)</option>
            <option value="name:desc">Name (Z-A)</option>
            <option value="dailyQuotaGallons:desc">Quota (high to low)</option>
            <option value="dailyQuotaGallons:asc">Quota (low to high)</option>
          </select>
        </div>
        <div class="field">
          <button type="reset" class="btn btn-ghost btn-block">Clear filters</button>
        </div>
      </form>
    </section>

    <section class="card" aria-label="Hydrant list">
      <div id="list" aria-live="polite"></div>
      <div id="pager"></div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/admin-hydrants.js"></script>
</body>
</html>
