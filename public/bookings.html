<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings · PaaniLink</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container">
    <div class="page-head">
      <div>
        <h1 id="page-title">Bookings</h1>
        <p class="muted" id="page-sub"></p>
      </div>
      <div class="actions" id="head-actions"></div>
    </div>

    <section class="card" aria-label="Filters">
      <form id="filters" class="filters" role="search">
        <div class="field">
          <label for="q">Search</label>
          <input id="q" name="q" type="search" placeholder="Booking no., name, address, tanker">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status"></select>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type" name="type"></select>
        </div>
        <div class="field" data-roles="officer admin">
          <label for="hydrantId">Hydrant</label>
          <select id="hydrantId" name="hydrantId"></select>
        </div>
        <div class="field" data-roles="admin">
          <label for="zoneId">Zone</label>
          <select id="zoneId" name="zoneId"></select>
        </div>
        <div class="field">
          <label for="dateFrom">Delivery from</label>
          <input id="dateFrom" name="dateFrom" type="date">
        </div>
        <div class="field">
          <label for="dateTo">Delivery to</label>
          <input id="dateTo" name="dateTo" type="date">
        </div>
        <div class="field">
          <label for="deliveryDate">Exact date</label>
          <input id="deliveryDate" name="deliveryDate" type="date">
        </div>
        <div class="field">
          <label for="sortBy">Sort by</label>
          <select id="sortBy" name="sortBy">
            <option value="id:desc">Newest first</option>
            <option value="id:asc">Oldest first</option>
            <option value="deliveryDate:asc">Delivery date (soonest)</option>
            <option value="deliveryDate:desc">Delivery date (latest)</option>
            <option value="amount:desc">Amount (high to low)</option>
            <option value="capacity:desc">Tanker size (large first)</option>
            <option value="status:asc">Status (A-Z)</option>
          </select>
        </div>
        <div class="field">
          <button type="reset" class="btn btn-ghost btn-block">Clear filters</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="page-title">
      <div id="list" aria-live="polite"></div>
      <div id="pager"></div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/bookings.js"></script>
</body>
</html>
