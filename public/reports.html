<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · PaaniLink</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container">
    <div class="page-head">
      <div>
        <h1>City reports</h1>
        <p class="muted" id="range-line">Bookings, water use, revenue and disputes for the whole city.</p>
      </div>
      <button type="button" class="btn btn-ghost" id="print-btn">Print</button>
    </div>

    <section class="card" aria-label="Date range">
      <form id="range-form" class="filters" novalidate>
        <div class="form-alert" role="alert" hidden></div>
        <div class="field">
          <label for="from">Delivery from <span class="req" aria-hidden="true">*</span></label>
          <input id="from" name="from" type="date" required>
        </div>
        <div class="field">
          <label for="to">Delivery to <span class="req" aria-hidden="true">*</span></label>
          <input id="to" name="to" type="date" required>
        </div>
        <div class="field">
          <button type="submit" class="btn btn-primary btn-block">Show report</button>
        </div>
      </form>
    </section>

    <div id="report" aria-live="polite"></div>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/reports.js"></script>
</body>
</html>
