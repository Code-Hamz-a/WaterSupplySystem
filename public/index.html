<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · PaaniLink</title>
  <meta name="description" content="PaaniLink water tanker booking and dispatch system">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <main id="main" class="auth">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo" aria-hidden="true">💧</div>
        <h1>PaaniLink</h1>
        <p class="muted">Water tanker booking &amp; dispatch · City Water Board</p>
      </div>

      <section class="card" aria-labelledby="login-title">
        <h2 id="login-title">Log in</h2>
        <div id="notice"></div>
        <form id="login-form" novalidate>
          <div class="form-alert" role="alert" hidden></div>
          <div class="field">
            <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
        <p class="mt small">New customer? <a href="register.html">Create an account</a></p>
      </section>

      <section class="card" id="demo-card" hidden aria-labelledby="demo-title">
        <h2 id="demo-title">Demo accounts</h2>
        <p class="small muted">Mock API only. Click one to fill the form.</p>
        <ul class="demo-list" id="demo-list"></ul>
      </section>
    </div>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
