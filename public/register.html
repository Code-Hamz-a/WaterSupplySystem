<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · PaaniLink</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <main id="main" class="auth">
    <div class="auth-card wide">
      <div class="auth-brand">
        <div class="logo" aria-hidden="true">💧</div>
        <h1>Create a customer account</h1>
        <p class="muted">You need your CNIC, mobile number and address.</p>
      </div>
      <section class="card">
        <form id="register-form" novalidate>
          <div class="form-alert" role="alert" hidden></div>
          <div class="form-grid cols-2">
            <div class="field span-2">
              <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
              <input id="name" name="name" autocomplete="name" required maxlength="60">
            </div>
            <div class="field">
              <label for="cnic">CNIC <span class="req" aria-hidden="true">*</span></label>
              <input id="cnic" name="cnic" inputmode="numeric" placeholder="42101-1234567-1" aria-describedby="cnic-hint" required>
              <small id="cnic-hint" class="hint">13 digits, dashes are added for you</small>
            </div>
            <div class="field">
              <label for="phone">Mobile number <span class="req" aria-hidden="true">*</span></label>
              <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="0300-1234567" autocomplete="tel" required>
            </div>
            <div class="field span-2">
              <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="zoneId">Zone <span class="req" aria-hidden="true">*</span></label>
              <select id="zoneId" name="zoneId" required aria-describedby="zone-hint"><option value="">Loading zones...</option></select>
              <small id="zone-hint" class="hint">The area your address is in</small>
            </div>
            <div class="field">
              <label for="address">Address <span class="req" aria-hidden="true">*</span></label>
              <input id="address" name="address" autocomplete="street-address" placeholder="House, street, block" required maxlength="200">
            </div>
            <div class="field">
              <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
              <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="pw-hint" required>
              <small id="pw-hint" class="hint">At least 8 characters with letters and numbers</small>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm password <span class="req" aria-hidden="true">*</span></label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
        <p class="mt small">Already registered? <a href="index.html">Log in</a></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
