<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rates · PaaniLink</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container">
    <div class="page-head">
      <div>
        <h1>Rates</h1>
        <p class="muted">Price per tanker size. The tanker sizes customers can book come from this list.</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-btn">Add rate</button>
    </div>

    <section class="card" aria-label="Filters">
      <form id="filters" class="filters">
        <div class="field">
          <label for="sortBy">Sort by</label>
          <select id="sortBy" name="sortBy">
            <option value="capacity:asc">Size (small first)</option>
            <option value="capacity:desc">Size (large first)</option>
          </select>
        </div>
      </form>
    </section>

    <section class="card" aria-label="Rate list">
      <div id="list" aria-live="polite"></div>
      <div id="pager"></div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script type="module" src="js/pages/admin-rates.js"></script>
</body>
</html>
